name: uptime
on:
  schedule:
    # Off the round minutes: GitHub delays or drops schedules that pile up at :00, :10, ...
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sites
        id: check
        run: |
          set +e
          ./check.sh > result.txt
          echo "failed=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: Open an outage issue, or note a change in what is down
        if: steps.check.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One issue per outage. Comment only when the set of failing URLs changes,
          # so a long outage is one notification, not one every ten minutes.
          fence='```'
          body="$(printf 'Checked at %s UTC from GitHub Actions.\n\n%s\n%s\n%s\n' "$(date -u +'%Y-%m-%d %H:%M')" "$fence" "$(cat result.txt)" "$fence")"
          n=$(gh issue list --label outage --state open --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --title "Outage: $(head -1 result.txt | sed 's/^DOWN [^h]*//')" --label outage --body "$body"
            exit 0
          fi
          last=$( { gh issue view "$n" --json body,comments --jq '.body, .comments[].body'; } | grep '^DOWN ' | sort -u )
          seen_all=1
          while read -r line; do
            printf '%s\n' "$last" | grep -qxF "$line" || seen_all=0
          done < result.txt
          if [ "$seen_all" = 0 ]; then gh issue comment "$n" --body "$body"; else echo "same failures as already reported; staying quiet"; fi
      - name: Close the outage issue when everything is back
        if: steps.check.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label outage --state open --json number --jq '.[0].number')
          [ -n "$n" ] && gh issue close "$n" --comment "All sites answering again at $(date -u +'%Y-%m-%d %H:%M') UTC." || true
