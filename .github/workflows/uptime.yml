name: uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sites
        id: check
        run: |
          set +e
          ./check.sh > result.txt
          echo "failed=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: Open or update an outage issue
        if: steps.check.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'Checked at %s UTC from GitHub Actions.\n\n```\n%s\n```\n' "$(date -u +'%Y-%m-%d %H:%M')" "$(cat result.txt)")"
          n=$(gh issue list --label outage --state open --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --title "Outage: $(head -1 result.txt | cut -d' ' -f3-)" --label outage --body "$body"
          else
            gh issue comment "$n" --body "$body"
          fi
      - name: Close the outage issue when everything is back
        if: steps.check.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label outage --state open --json number --jq '.[0].number')
          [ -n "$n" ] && gh issue close "$n" --comment "All sites answering again at $(date -u +'%Y-%m-%d %H:%M') UTC." || true
